<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="description" content="AA同好會 2026 夏季活動作品一覽">
  <title>AA同好會 2026 夏季活動</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/buttom.css">
  <style>
    .summer-topics { display: grid; gap: 0.75rem; }
    .summer-topic { padding: 0.75rem 1rem; border-left: 3px solid #e0e0e0; }
    .summer-topic h3 { margin: 0 0 0.35rem; }
    .summer-topic a { display: inline-block; }
    .participant-heading { display: flex; align-items: center; gap: 0.75rem; }
    .participant-heading img { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; }
    .topic-empty { color: #777; margin: 0; }
    #work-links ul { margin: 0 0 0.75rem 1rem; }
    #work-links strong { display: block; margin-top: 0.5rem; }
    .load-error { color: #a33; }
  </style>
</head>
<body class="is-preload">
  <div id="content">
    <article class="box post post-excerpt">
      <header>
        <h2 id="event-title">AA夏季活動 2026</h2>
        <p>依參加者順序展示第一篇至第五篇投稿作品</p>
      </header>
      <div class="info">
        <span class="date">
          <span class="month">Summer<span>2026</span></span>
          <span class="day">作品</span>
        </span>
      </div>
      <p>
        每位參加者的投稿會固定依照活動題目順序排列：第一篇、第二篇、第三篇、第四篇、第五篇。
        尚未投稿的欄位會保留位置並標示「尚無投稿」。
      </p>
    </article>
  </div>

  <div id="sidebar">
    <h1 id="logo"><a href="/">AA同好會</a></h1>
    <nav id="nav">
      <ul><li class="current"><a href="/">首頁</a></li></ul>
    </nav>
    <section class="box recent-posts">
      <header><h2>作品連結</h2></header>
      <ul id="work-links"></ul>
    </section>
    <section class="box text-style1">
      <div class="inner"><p><strong>2026 夏季活動</strong><br>作品依參加者及篇章順序排列。</p></div>
    </section>
  </div>

  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/browser.min.js"></script>
  <script src="/assets/js/breakpoints.min.js"></script>
  <script src="/assets/js/util.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    function loadJson(path, fallback) {
      return fetch(path).then(function (response) {
        if (!response.ok) throw new Error(path + " returned " + response.status);
        return response.json();
      }).catch(function () { return fallback; });
    }

    function topicForWork(work, topic) {
      return work.topicKey === topic.key || work.topic === topic.name;
    }

    function createWorkLink(work) {
      var link = document.createElement("a");
      link.href = work.url;
      link.textContent = work.title;
      link.className = "button";
      return link;
    }

    function createParticipantArticle(player, topics, works) {
      var article = document.createElement("article");
      article.className = "box post post-excerpt";
      article.id = "participant-" + player.uid;

      var header = document.createElement("header");
      var heading = document.createElement("div");
      heading.className = "participant-heading";
      if (player.image) {
        var avatar = document.createElement("img");
        avatar.src = player.image;
        avatar.alt = (player.name || "參加者") + " icon";
        heading.appendChild(avatar);
      }
      var title = document.createElement("h2");
      title.textContent = player.name || ("參加者 " + player.uid);
      heading.appendChild(title);
      header.appendChild(heading);
      article.appendChild(header);

      var grid = document.createElement("div");
      grid.className = "summer-topics";
      topics.forEach(function (topic) {
        var row = document.createElement("section");
        row.className = "summer-topic";
        var heading = document.createElement("h3");
        heading.textContent = topic.name;
        row.appendChild(heading);
        var work = works.find(function (item) {
          return item.hashId === player.hashId && topicForWork(item, topic);
        });
        if (work) {
          row.appendChild(createWorkLink(work));
        } else {
          var empty = document.createElement("p");
          empty.className = "topic-empty";
          empty.textContent = "尚無投稿";
          row.appendChild(empty);
        }
        grid.appendChild(row);
      });
      article.appendChild(grid);
      return article;
    }

    function renderSidebar(players, topics, works) {
      var list = document.getElementById("work-links");
      players.forEach(function (player) {
        var item = document.createElement("li");
        var name = document.createElement("strong");
        name.textContent = player.name || ("參加者 " + player.uid);
        item.appendChild(name);
        var topicList = document.createElement("ul");
        topics.forEach(function (topic) {
          var work = works.find(function (entry) {
            return entry.hashId === player.hashId && topicForWork(entry, topic);
          });
          if (!work) return;
          var topicItem = document.createElement("li");
          var link = document.createElement("a");
          link.href = work.url;
          link.textContent = topic.name + "：" + work.title;
          topicItem.appendChild(link);
          topicList.appendChild(topicItem);
        });
        item.appendChild(topicList);
        list.appendChild(item);
      });
    }

    Promise.all([
      loadJson("./event-public.json", { display_name: "2026SummerEvent", topics: [] }),
      loadJson("./data/playerHashMap.json", []),
      loadJson("./data/workUserMap.json", [])
    ]).then(function (data) {
      var eventInfo = data[0];
      var players = data[1].slice().sort(function (a, b) { return a.uid - b.uid; });
      var works = data[2];
      var topics = eventInfo.topics || [];
      document.title = eventInfo.display_name || document.title;
      document.getElementById("event-title").textContent = eventInfo.display_name || "AA夏季活動 2026";
      renderSidebar(players, topics, works);
      var content = document.getElementById("content");
      players.forEach(function (player) {
        content.appendChild(createParticipantArticle(player, topics, works));
      });
      if (!players.length) {
        var empty = document.createElement("p");
        empty.className = "topic-empty";
        empty.textContent = "尚未有公開投稿。";
        content.appendChild(empty);
      }
    }).catch(function () {
      var error = document.createElement("p");
      error.className = "load-error";
      error.textContent = "活動作品載入失敗，請稍後再試。";
      document.getElementById("content").appendChild(error);
    });
  </script>
</body>
</html>
